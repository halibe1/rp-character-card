name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test engine
        run: node tests/engine.test.js
      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html css js data assets _site/ 2>/dev/null || cp -r index.html css js data _site/
      - name: Cache-busting for scripts and styles
        run: sed -i -E "s#(src|href)=\"((js|css|data)/[^\"?]+)\"#\1=\"\2?v=\"#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4